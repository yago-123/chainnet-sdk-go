name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install tools
        uses: jdx/mise-action@v2

      - name: CI
        run: make ci

      - name: Resolve release tags
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          current_tag="${GITHUB_REF_NAME}"

          if [[ "$current_tag" == *-* ]]; then
            release_tag="${current_tag%%-*}"
            previous_tag="$(git tag --merged "$current_tag" --sort=-version:refname 'v[0-9]*' | grep -Fvx "$current_tag" | grep -Fvx "$release_tag" | head -n 1)"
          else
            previous_tag="$(git tag --merged "$current_tag" --sort=-version:refname 'v[0-9]*' | grep -Fvx "$current_tag" | grep -v -- '-' | head -n 1)"
          fi

          echo "GORELEASER_CURRENT_TAG=$current_tag" >> "$GITHUB_ENV"
          echo "GORELEASER_PREVIOUS_TAG=$previous_tag" >> "$GITHUB_ENV"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          goreleaser release --clean
